[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradefix-narrator"
version = "1.0.0"
description = "Speech core for a live XAUUSD trading stream. Narrates the operator's own templates with live numbers, and drives a VRM avatar's mouth from phonemes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Trade Fix" }]
keywords = ["trading", "tts", "vtuber", "vrm", "metatrader", "kokoro"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
]

# torch/torchaudio are deliberately NOT here: they must come from the CUDA
# 12.8 index or the RTX 5080 (Blackwell, sm_120) has no kernels.
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
dependencies = [
  "pydantic>=2.6",
  "rich>=13.7",
  "MetaTrader5>=5.0.45",
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[project.scripts]
narrator = "narrator.main:main"

[project.urls]
Documentation = "https://github.com/"

[tool.setuptools]
packages = [
  "narrator",
  "narrator.market",
  "narrator.script",
  "narrator.speech",
  "narrator.avatar",
  "narrator.ui",
]

[tool.setuptools.package-data]
"narrator.ui" = ["web/*.html", "web/*.css", "web/*.js"]


# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: takes more than a second (deselect with -m 'not slow')",
  "integration: drives the whole app end to end",
]
filterwarnings = [
  "error::DeprecationWarning:narrator.*",
]

[tool.coverage.run]
source = ["narrator"]
branch = true
omit = [
  "narrator/main.py",          # covered by the integration test, not units
  "narrator/ui/dashboard.py",  # terminal rendering
]

[tool.coverage.report]
# A floor, not a target. The uncovered remainder is mostly hardware paths:
# a live MT5 terminal, a real audio device, a running Warudo.
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]


# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = [".venv", "cache", "logs", "avatars"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return style
  "PTH",       # pathlib over os.path
  "RUF",
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # function call in default arg -- pydantic Field() needs it
  "RUF012",  # mutable class attrs; pydantic models are fine
  "SIM108",  # ternaries are not always clearer
  "SIM102",  # a nested if often reads better than one long and
  "RUF007",  # zip(xs, xs[1:]) is clearer than pairwise for successive pairs
]

[tool.ruff.lint.per-file-ignores]
# IPA phonemes are the whole point of these modules; "ambiguous unicode" is
# exactly the character set they are supposed to contain.
"narrator/speech/phonemes.py" = ["RUF001", "RUF002", "RUF003"]
"narrator/speech/visemes.py" = ["RUF001", "RUF002", "RUF003"]
"narrator/ui/dashboard.py" = ["RUF001"]
"tests/*" = ["B011", "SIM117", "RUF001", "RUF002"]
"tools/*" = ["B008", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["narrator"]


# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["narrator"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Pragmatic, not zealous: this codebase talks to MT5, Kokoro and Warudo,
# none of which ship type stubs worth trusting.
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["MetaTrader5.*", "kokoro.*", "sounddevice.*", "websockets.*", "torch.*"]
ignore_errors = true
